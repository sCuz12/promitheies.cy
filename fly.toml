app = "symvaseis-cy"
primary_region = "fra"

[build]

[env]
  HTTP_ADDR = ":8080"

[processes]
  web = "./server"
  cron = "supercronic /app/crontab"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
